{% extends "base.html" %}

{% block title %}Профиль{% endblock %}

{% block content %}
<div style="text-align: center;">
    <h2 style="margin-bottom: 20px;">Профиль пользователя</h2>
    
    <div style="background: white; padding: 30px; border-radius: 15px; max-width: 400px; margin: 0 auto;">
        <div style="font-size: 3rem; margin-bottom: 20px;">👤</div>
        <h3 style="color: #333; margin-bottom: 10px;">{{ user.username }}</h3>
        <p style="color: #666; margin-bottom: 10px;">{{ user.email }}</p>
        <p style="color: #999; font-size: 0.9em;">Зарегистрирован: {{ user.created_at.strftime('%d.%m.%Y') }}</p>
        
        <div style="margin-top: 30px;">
            <a href="{{ url_for('auth.logout') }}" class="nav-link" 
               style="display: inline-block; background: #ff6b6b;">Выйти</a>
        </div>
    </div>
</div>
{% endblock %}
